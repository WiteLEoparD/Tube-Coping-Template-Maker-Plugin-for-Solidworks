name: Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build SolidWorks Add-in Library
      run: |
        msbuild SolidWorks_TubeCutTemplate_Addin\SolidWorks_TubeCutTemplate_Addin.csproj /p:Configuration=Release /p:Platform=x64

    - name: Build Standalone Demo
      run: |
        msbuild SolidWorks_TubeCutTemplate_Addin\StandaloneDemo\StandaloneDemo.csproj /p:Configuration=Release /p:Platform=x64

    - name: Build Installer GUI
      run: |
        msbuild SolidWorks_TubeCutTemplate_Addin\Installer\Installer.csproj /p:Configuration=Release /p:Platform=x64

    - name: Run Standalone Verification Demo
      run: |
        .\SolidWorks_TubeCutTemplate_Addin\StandaloneDemo\bin\x64\Release\net48\BajaSAE.StandaloneDemo.exe
